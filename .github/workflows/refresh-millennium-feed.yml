name: Refresh Millennium research feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: millennium-research-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh feed
        run: python3 scripts/refresh_millennium_feed.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/millennium-feed.json; then
            echo "Feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/millennium-feed.json
          git commit -m "Refresh Millennium research feed"
          git push origin HEAD:${GITHUB_REF_NAME}
